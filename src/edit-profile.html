<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원정보 수정 | kateboo</title>

    <link rel="stylesheet" href="css/pages/edit-profile.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/modal.css" />
    <link rel="stylesheet" href="css/common/body.css" />
    <link rel="stylesheet" href="css/common/form.css" />
  </head>

  <body>
    <main class="edit-container">
      <h2>회원정보수정</h2>

      <div class="profile-section" id="uploadArea">
        <p>프로필 사진*</p>
        <div class="profile-wrapper">
          <img
            src=""
            alt="프로필 사진"
            class="profile-img gray"
            id="previewImg"
          />
          <button type="button" class="change-btn" id="changeBtn">변경</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" hidden />
      </div>

      <form class="form-section" id="formSection">
        <label>이메일</label>
        <input
          type="text"
          value=""
          disabled
          class="email-field"
          id="emailField"
        />

        <label>닉네임</label>
        <input type="text" id="nickname" placeholder="닉네임을 입력해주세요." />
        <p id="nicknameHelper" class="helper-text"></p>

        <button id="submitBtn" class="submit-btn" type="submit">
          수정하기
        </button>
      </form>
      <button id="withdrawBtn" class="withdraw-btn">회원 탈퇴</button>

      <div id="toast">수정 완료</div>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      import { loadModal } from "./js/common/include-modal.js";

      loadHeader({ back: true, profile: true });
      loadModal();
    </script>

    <script type="module" src="js/edit-profile-script.js"></script>
  </body>
</html>
