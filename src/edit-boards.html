<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 수정 | kateboo</title>

    <link rel="stylesheet" href="css/pages/edit-boards.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/modal.css" />
    <link rel="stylesheet" href="css/common/body.css" />
    <link rel="stylesheet" href="css/common/form.css" />
  </head>

  <body>
    <main class="post-wrapper">
      <h2>게시글 수정</h2>
      <form class="post-form" , id="postForm">
        <label for="title">제목*</label>
        <input
          type="text"
          id="title"
          placeholder="제목을 입력해주세요. (최대 26글자)"
          maxlength="26"
          required
        />

        <label for="content">내용*</label>
        <textarea
          id="content"
          rows="6"
          placeholder="내용을 입력해주세요."
          required
        ></textarea>

        <label for="image">이미지</label>
        <input type="file" id="image" accept="image/*" multiple />
        <div id="preview"></div>

        <button type="submit" id="edit-btn" class="submit-btn">
          수정 완료
        </button>
      </form>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      import { loadModal } from "./js/common/include-modal.js";

      loadHeader({ back: true, profile: true });
      loadModal();
    </script>

    <script type="module" src="js/edit-boards-script.js"></script>
  </body>
</html>
