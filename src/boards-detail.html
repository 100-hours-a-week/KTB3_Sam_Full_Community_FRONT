<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 상세조회 | kateboo</title>
    <link rel="stylesheet" href="css/pages/boards-detail.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/modal.css" />
    <link rel="stylesheet" href="css/common/body.css" />
  </head>

  <body>
    <main class="post-wrapper">
      <section class="post-content">
        <h2 id="post-title"></h2>

        <div class="post-header">
          <img src="" alt="작성자 프로필" class="author-img" id="authorImg" />
          <div class="author-info">
            <span id="post-author"></span> |
            <span id="post-date"></span>
          </div>

          <div class="post-actions">
            <button id="edit-btn">수정</button>
            <button id="delete-btn" class="danger">삭제</button>
          </div>
        </div>

        <div class="post-body-wrapper">
          <div id="imageSlider" class="image-slider">
            <img id="sliderImage" src="" alt="게시글 이미지" />
          </div>
          <div id="sliderDots" class="slider-dots"></div>

          <p id="post-body"></p>
        </div>

        <div class="post-stats">
          <div class="stat-box" id="likes" data-liked="false">
            <strong id="likesCount"></strong>
            <span>좋아요수</span>
          </div>

          <div class="stat-box" id="visitors">
            <strong id="visitorsCount"></strong>
            <span>조회수</span>
          </div>

          <div class="stat-box" id="commentsNumber">
            <strong id="commentsNumberCount"></strong>
            <span>댓글</span>
          </div>
        </div>
      </section>

      <section class="comment-section">
        <textarea
          id="comment-input"
          placeholder="댓글을 남겨주세요!"
        ></textarea>
        <div class="comment-submit-wrapper">
          <button id="comment-submit">댓글 등록</button>
        </div>

        <ul id="comment-list"></ul>
      </section>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      import { loadModal } from "./js/common/include-modal.js";

      loadHeader({
        back: true,
        profile: true,
        backUrl: "boards.html",
      });
      loadModal();
    </script>
    <script type="module" src="js/boards-detail-script.js"></script>
  </body>
</html>
