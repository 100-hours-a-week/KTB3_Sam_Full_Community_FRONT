<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 작성 | kateboo</title>
    <link rel="stylesheet" href="css/pages/add-boards.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/modal.css" />
    <link rel="stylesheet" href="css/common/body.css" />
    <link rel="stylesheet" href="css/common/form.css" />
  </head>
  <body>
    <main class="post-wrapper">
      <h2>게시글 작성</h2>
      <form class="post-form" id="postForm">
        <label for="title">제목*</label>
        <input
          type="text"
          id="title"
          placeholder="제목을 입력해주세요. (최대 26글자)"
          maxlength="26"
          required
        />
        <p class="helper-text" id="title-helper"></p>

        <label for="content">내용*</label>
        <textarea
          id="content"
          rows="6"
          placeholder="내용을 입력해주세요."
          required
        ></textarea>
        <p class="helper-text" id="content-helper"></p>

        <label for="image">이미지</label>
        <input type="file" id="image" accept="image/*" multiple />
        <div id="preview"></div>
        <p class="helper-text" id="image-helper"></p>

        <button type="submit" id="add-btn">완료</button>
      </form>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      import { loadModal } from "./js/common/include-modal.js";

      loadHeader({ back: true, profile: true });
      loadModal();
    </script>

    <script type="module" src="js/add-boards-script.js"></script>
  </body>
</html>
