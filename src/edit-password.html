<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 수정 | kateboo</title>

    <link rel="stylesheet" href="css/pages/edit-password.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/body.css" />
    <link rel="stylesheet" href="css/common/form.css" />
  </head>

  <body>
    <main class="edit-container">
      <h2>비밀번호 수정</h2>

      <form id="passwordForm" class="form-section">
        <label>비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호를 입력하세요"
        />
        <p id="passwordHelper" class="helper-text"></p>

        <label>비밀번호 확인</label>
        <input
          type="password"
          id="passwordCheck"
          placeholder="비밀번호를 한번 더 입력하세요"
        />
        <p id="passwordCheckHelper" class="helper-text"></p>

        <button id="submitBtn" class="submit-btn" type="submit" disabled>
          수정하기
        </button>
      </form>

      <div id="toast">수정 완료</div>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      loadHeader({ back: true, profile: true });
    </script>

    <script type="module" src="js/edit-password-script.js"></script>
  </body>
</html>
