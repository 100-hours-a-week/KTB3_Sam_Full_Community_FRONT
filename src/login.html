<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | kateboo</title>

    <link rel="stylesheet" href="css/pages/login.css" />
    <link rel="stylesheet" href="css/common/header.css" />
    <link rel="stylesheet" href="css/common/body.css" />
    <link rel="stylesheet" href="css/common/form.css" />
  </head>

  <body>
    <main class="login-wrapper">
      <h1>로그인</h1>
      <form class="login-form" id="loginForm">
        <div class="input-box">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력하세요"
            required
          />
          <p id="emailHelper" class="helper-text"></p>

          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            placeholder="비밀번호를 입력하세요"
            required
          />
          <p id="passwordHelper" class="helper-text"></p>
        </div>

        <button type="submit" id="loginBtn" class="login-button">로그인</button>
      </form>
      <a href="signup.html" class="signup-link">회원가입</a>
    </main>

    <script type="module">
      import { loadHeader } from "./js/common/include-header.js";
      loadHeader({ back: false, profile: false });
    </script>

    <script type="module" src="js/login-script.js"></script>
  </body>
</html>
